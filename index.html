<!doctype html>
<html lang="es">
  <head>
    <script>
      try {
        const saved = localStorage.getItem('aurelia-theme');
        document.documentElement.dataset.theme = saved === 'light' || saved === 'dark' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch { document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e3931" />
    <meta
      name="description"
      content="Aurelia Estates — hogares excepcionales, relaciones auténticas. Tu espacio inmobiliario privado."
    />
    <title>Aurelia Estates — CRM inmobiliario privado</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
